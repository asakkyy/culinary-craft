name: Backend CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run Checkstyle (Static Analysis)
        run: ./gradlew checkstyleMain checkstyleTest
        
      - name: Run tests and generate JaCoCo report
        run: ./gradlew test jacocoTestReport
        
      # Отображение покрытия прямо в Pull Request
      - name: Report Coverage
        uses: getsentry/coverage-action@0.3.8
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          coverage-format: jacoco
          
      - name: Build JAR
        run: ./gradlew build -x test

      # Выгрузка всех отчетов в артефакты
      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checkstyle-report
          path: backend/build/reports/checkstyle/
          
      - name: Upload JUnit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit-results
          path: backend/build/test-results/test/
          
      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-html
          path: backend/build/reports/jacoco/test/html/