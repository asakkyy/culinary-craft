name: Quality CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Snapshot for laboratory milestone'
        required: true
        type: choice
        default: regular-ci
        options: [regular-ci, M6-prototype, M7-testing]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  backend:
    name: 'Backend: Checkstyle, JUnit, integration, JaCoCo, JAR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*
      - name: Allow Gradle wrapper execution
        run: chmod +x backend/gradlew
      - name: Run tests, coverage and static checks
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean check bootJar --no-daemon --console=plain 2>&1 | tee gradle-ci.log
      - name: Collect all backend reports (including failures)
        if: always()
        shell: bash
        run: |
          mkdir -p backend/reports/backend/{static/checkstyle,tests,coverage,build}
          cp backend/gradle-ci.log backend/reports/backend/build/gradle-ci.log 2>/dev/null || true
          cp backend/build/reports/checkstyle/* backend/reports/backend/static/checkstyle/ 2>/dev/null || true
          cp backend/build/test-results/test/TEST-*.xml backend/reports/backend/tests/ 2>/dev/null || true
          cp -r backend/build/reports/tests/test backend/reports/backend/tests/html 2>/dev/null || true
          cp backend/build/reports/jacoco/test/jacocoTestReport.* backend/reports/backend/coverage/ 2>/dev/null || true
          cp -r backend/build/reports/jacoco/test/html backend/reports/backend/coverage/html 2>/dev/null || true
          cp backend/build/libs/*.jar backend/reports/backend/build/ 2>/dev/null || true
      - name: Upload backend quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-report
          path: backend/reports/backend/
          if-no-files-found: warn
          retention-days: 60

  frontend:
    name: 'Frontend: ESLint, Vitest, coverage and production build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Prepare report folders
        working-directory: frontend
        run: node scripts/prepare-reports.mjs
      - name: ESLint static analysis
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run lint:ci 2>&1 | tee reports/frontend/static/eslint-console.log
      - name: Vitest unit and component tests with coverage
        if: always()
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee reports/frontend/tests/vitest-console.log
      - name: Production build
        if: always()
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee reports/frontend/build/vite-build.log
      - name: Collect production files
        if: always()
        shell: bash
        run: cp -r frontend/dist frontend/reports/frontend/build/dist 2>/dev/null || true
      - name: Upload frontend quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-report
          path: frontend/reports/frontend/
          if-no-files-found: warn
          retention-days: 60

  e2e:
    name: 'Browser E2E: real React + Spring Boot + Chromium'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow Gradle wrapper execution
        run: chmod +x backend/gradlew
      - name: Install frontend packages
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Chromium and Linux browser libraries
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare report directories
        working-directory: frontend
        run: node scripts/prepare-reports.mjs
      - name: Test real user flows in browser
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser HTML, JUnit XML, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/reports/frontend/tests/playwright-junit.xml
          if-no-files-found: warn
          retention-days: 60

  metrics:
    name: 'Metrics: coverage, static checks, individual tests and Git history'
    if: always()
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-quality-report
          path: ci-input/backend
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-quality-report
          path: ci-input/frontend
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: browser-e2e-report
          path: ci-input/browser
      - name: Put Playwright JUnit results alongside frontend test reports
        shell: bash
        run: |
          mkdir -p ci-input/frontend/tests
          REPORT="$(find ci-input/browser -type f -name playwright-junit.xml -print -quit 2>/dev/null || true)"
          if [ -n "$REPORT" ]; then cp "$REPORT" ci-input/frontend/tests/playwright-junit.xml; fi
      - name: Generate CSV, JSON, summary and per-test report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGE_NAME: ${{ inputs.stage || 'regular-ci' }}
        run: |
          python3 scripts/collect_metrics.py \
            --backend-dir ci-input/backend \
            --frontend-dir ci-input/frontend \
            --output-dir reports/summary \
            --stage "$STAGE_NAME" \
            --require-complete
      - name: Upload metrics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics-${{ github.run_number }}-${{ github.run_attempt }}
          path: reports/summary/
          if-no-files-found: warn
          retention-days: 60

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [backend, frontend, e2e, metrics]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all mandatory checks
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          E2E: ${{ needs.e2e.result }}
          METRICS: ${{ needs.metrics.result }}
        shell: bash
        run: |
          {
            echo '## Quality Gate'
            echo "- Backend: **$BACKEND**"
            echo "- Frontend: **$FRONTEND**"
            echo "- E2E: **$E2E**"
            echo "- Metrics: **$METRICS**"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$BACKEND" == success && "$FRONTEND" == success && "$E2E" == success && "$METRICS" == success ]]
