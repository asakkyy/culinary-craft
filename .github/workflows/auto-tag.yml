name: Auto Tag

on:
  push:
    branches:
      - main

# ВЫДАЕМ ПРАВА НА ЗАПИСЬ, ЧТОБЫ МОЖНО БЫЛО ПУШИТЬ ТЕГИ
permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} # <-- Явно указываем токен
          
      - name: Bump version and push tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main