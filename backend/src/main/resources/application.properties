spring.application.name=culinary-craft-prototype
server.port=8080
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=none
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/culinary_craft}
spring.datasource.username=${DB_USERNAME:culinary_demo}
spring.datasource.password=${DB_PASSWORD:culinary_demo_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.mail.properties.mail.smtp.localhost=${MAIL_HELO:culinary-craft.local}
spring.mail.properties.mail.from=${MAIL_FROM:culinary@localhost}
logging.level.org.springframework.web=INFO
