# Backend runs on the host: MEDIA_ROOT points to a persistent host directory.
# When containerizing backend, mount the same directory into that service;
# PostgreSQL volumes do not contain uploaded files.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-culinary_craft}
      POSTGRES_USER: ${DB_USERNAME:-culinary_demo}
      # Local demonstration value only; override for any shared environment.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-culinary_demo_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
